---
# macOS desktop: tiling window manager, status bar, window borders, GUI apps.
# Kept separate from setup-dev-environment.yml so a server/CLI-only box can skip it.
# Prompts before the optional pieces (status bar, comms apps).
- name: Setup macOS desktop environment
  hosts: localhost
  vars_prompt:
    - name: install_bar
      prompt: "Install the status bar (sketchybar + borders)? [Y/n]"
      private: false
      default: "Y"
    - name: install_comms
      prompt: "Install comms apps (Slack, WhatsApp)? [y/N]"
      private: false
      default: "N"
  vars:
    homebrew_taps:
      - FelixKratz/formulae
      - nikitabobko/tap
    bar_formulae:
      - sketchybar
      - borders
    desktop_casks:
      - aerospace
      - wezterm
      - zed
      - zen
      - maccy
      - font-blex-mono-nerd-font
    comms_casks:
      - slack
      - whatsapp

  pre_tasks:
    - name: Require macOS
      ansible.builtin.fail:
        msg: "This playbook is macOS-only. Current OS: {{ ansible_facts['os_family'] }}"
      when: ansible_facts['os_family'] != 'Darwin'

  tasks:
    - name: Add Homebrew taps
      community.general.homebrew_tap:
        name: "{{ item }}"
        state: present
        path: /opt/homebrew/bin
      loop: "{{ homebrew_taps }}"

    - name: Trust third-party Homebrew taps
      ansible.builtin.command: "/opt/homebrew/bin/brew trust --tap {{ item }}"
      loop: "{{ homebrew_taps }}"
      changed_when: false

    - name: Install status bar (sketchybar, borders)
      community.general.homebrew:
        name: "{{ bar_formulae }}"
        state: present
        path: /opt/homebrew/bin
      when: install_bar | lower != 'n'

    - name: Install desktop apps (window manager, terminal, editor, browser, clipboard, font)
      community.general.homebrew_cask:
        name: "{{ desktop_casks }}"
        state: present
        path: /opt/homebrew/bin

    - name: Install comms apps (Slack, WhatsApp)
      community.general.homebrew_cask:
        name: "{{ comms_casks }}"
        state: present
        path: /opt/homebrew/bin
      when: install_comms | lower == 'y'
