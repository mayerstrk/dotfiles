---
- name: Setup dev environment
  hosts: localhost
  vars:
    username: "{{ ansible_user_id }}"
    dotfiles_repo: "https://github.com/mayerstrk/dotfiles.git"
    dotfiles_local_path: "~/.dotfiles"
    install_report: {}
    homebrew_packages:
      # shell and prompt
      - fish
      - starship
      # core cli
      - git
      - gh
      - ghq
      - jj
      - lazygit
      - git-delta
      - difftastic
      - zoxide
      - fzf
      - fd
      - ripgrep
      - eza
      - bat
      - wget
      # editor and multiplexers
      - neovim
      - tree-sitter-cli
      - luarocks
      - zellij
      - tmux
      # languages and toolchains (c/c++ come from Xcode CLT, see the Makefile)
      - go
      - rustup
      - uv
      - pipx
      - pnpm
      - tfenv

  pre_tasks:
    - name: Verify environment and initialize
      block:
        - name: Check operating system
          ansible.builtin.fail:
            msg: "This playbook requires macOS. Current OS: {{ ansible_facts['os_family'] }}"
          when: ansible_facts['os_family'] != 'Darwin'

        - name: Initialize install report
          set_fact:
            install_report:
              os_type: "{{ ansible_facts['os_family'] }}"
              homebrew_status: "not checked"
              packages_installed: []
              packages_failed: []
              fish_status: "not checked"
              fisher_status: "not checked"
              fisher_plugins: []
              dotfiles_status: "not started"
              configs_linked: []
              backups_created: []

        - name: Set backup timestamp
          set_fact:
            backup_timestamp: "{{ ansible_date_time.date }}_{{ ansible_date_time.time }}"
      tags: always

    - name: Configure Homebrew
      block:
        - name: Check if Homebrew is installed
          ansible.builtin.command: which brew
          register: homebrew_status
          ignore_errors: true
          changed_when: false

        - name: Install Homebrew if missing
          ansible.builtin.shell: |
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          register: homebrew_installation
          when: homebrew_status.rc != 0

        - name: Initialize Homebrew in current shell
          ansible.builtin.shell: eval "$(/opt/homebrew/bin/brew shellenv)"
          args:
            executable: /bin/bash

        - name: Report Homebrew status
          ansible.builtin.debug:
            msg: "Homebrew {{ 'was installed successfully' if homebrew_status.rc == 0 or homebrew_installation is success else 'installation failed' }}"
      tags: 
        - always
        - setup

  tasks:
    - name: Install Homebrew packages
      block:
        - name: Ensure Homebrew packages are present
          community.general.homebrew:
            name: "{{ homebrew_packages }}"
            state: present
            path: /opt/homebrew/bin
          register: brew_packages

        - name: Track installed packages
          set_fact:
            install_report: "{{ install_report | combine({'packages_installed': homebrew_packages}) }}"
      when: homebrew_status.rc == 0 or homebrew_installation is success
      tags:
        - setup
        - packages

    - name: Set up the Rust stable toolchain via rustup
      ansible.builtin.command: rustup default stable
      register: rustup_result
      changed_when: "'installed' in (rustup_result.stdout + rustup_result.stderr)"
      failed_when: false
      environment:
        PATH: "/opt/homebrew/bin:{{ ansible_env.PATH }}"
      tags:
        - setup
        - rust

    - name: Install Node LTS through pnpm (keeps npm out of the workflow)
      ansible.builtin.command: pnpm env use --global lts
      register: pnpm_node_result
      changed_when: "'Node.js' in (pnpm_node_result.stdout | default(''))"
      failed_when: false
      environment:
        PATH: "/opt/homebrew/bin:{{ ansible_env.PATH }}"
        PNPM_HOME: "{{ ansible_env.HOME }}/Library/pnpm"
      tags:
        - setup
        - node

    - name: Verify Fish shell
      block:
        - name: Check Fish shell installation
          ansible.builtin.command: which fish
          register: fish_status
          ignore_errors: true
          changed_when: false

        - name: Report Fish shell status
          ansible.builtin.debug:
            msg: "Fish shell {{ 'is installed at ' + fish_status.stdout if fish_status.rc == 0 else 'is not installed' }}"
      tags:
        - fish
        - check

    - name: Manage dotfiles
      block:
        - name: Check for existing dotfiles
          ansible.builtin.stat:
            path: "{{ dotfiles_local_path | expanduser }}"
          register: dotfiles_status

        - name: Create backup directory if needed
          ansible.builtin.file:
            path: "{{ dotfiles_local_path | expanduser }}.{{ backup_timestamp }}.bak"
            state: directory
          when: dotfiles_status.stat.exists

        - name: Backup existing dotfiles if they exist
          ansible.builtin.shell: |
            cp -R {{ dotfiles_local_path | expanduser }}/* {{ dotfiles_local_path | expanduser }}.{{ backup_timestamp }}.bak/
          when: dotfiles_status.stat.exists
          register: dotfiles_backup

        - name: Remove existing dotfiles directory
          ansible.builtin.file:
            path: "{{ dotfiles_local_path | expanduser }}"
            state: absent
          when: dotfiles_status.stat.exists

        - name: Clone dotfiles repository
          ansible.builtin.git:
            repo: "{{ dotfiles_repo }}"
            dest: "{{ dotfiles_local_path | expanduser }}"
            accept_hostkey: yes
          register: dotfiles_clone

        - name: Report status
          ansible.builtin.debug:
            msg: "Dotfiles {{ 'backed up and ' if dotfiles_backup.changed else '' }}cloned successfully"
          when: dotfiles_clone is success
      tags:
        - dotfiles
        - setup

    - name: Manage config files
      block:
        - name: Check existing configurations
          ansible.builtin.stat:
            path: ~/.config
          register: config_status

        - name: Create backup of .config
          ansible.builtin.shell: |
            cp -r ~/.config ~/.config.{{ backup_timestamp }}.bak
          when: config_status.stat.exists
          register: config_backup

        - name: Report config backup status
          ansible.builtin.debug:
            msg: "Created .config backup at ~/.config.{{ backup_timestamp }}.bak"
          when: config_backup.changed

        - name: Create .config symlink
          ansible.builtin.file:
            src: "{{ dotfiles_local_path | expanduser }}/.config"
            dest: ~/.config
            state: link
            force: yes
          register: config_link

        - name: Check .gitconfig
          ansible.builtin.stat:
            path: ~/.gitconfig
          register: gitconfig_status

        - name: Create backup of .gitconfig
          ansible.builtin.shell: |
            cp ~/.gitconfig ~/.gitconfig.{{ backup_timestamp }}.bak
          when: gitconfig_status.stat.exists
          register: gitconfig_backup

        - name: Report gitconfig backup status
          ansible.builtin.debug:
            msg: "Created .gitconfig backup at ~/.gitconfig.{{ backup_timestamp }}.bak"
          when: gitconfig_backup.changed

        - name: Create .gitconfig symlink
          ansible.builtin.file:
            src: "{{ dotfiles_local_path | expanduser }}/.gitconfig"
            dest: ~/.gitconfig
            state: link
            force: yes
          register: gitconfig_link

        - name: Report symlink creation status
          ansible.builtin.debug:
            msg: >-
              Created symlinks:
              .config -> {{ dotfiles_local_path }}/.config
              .gitconfig -> {{ dotfiles_local_path }}/.gitconfig

        - name: Update symlinks report
          set_fact:
            install_report: "{{ install_report | combine({
              'configs_linked': (
                (['config'] if config_link.changed else []) +
                (['gitconfig'] if gitconfig_link.changed else [])
              )
            }) }}"

      rescue:
        - name: Report configuration failure
          ansible.builtin.debug:
            msg: "Failed to manage some configuration files"

        - name: Update failure report
          set_fact:
            install_report: "{{ install_report | combine({
              'configs_linked': install_report.configs_linked + ['failed to link some configs']
            }) }}"
      tags:
        - config
        - setup

    - name: Configure Fish with Homebrew path
      block:
        - name: Ensure Fish config directory exists
          ansible.builtin.file:
            path: ~/.config/fish
            state: directory
            mode: '0755'

        - name: Add Homebrew to Fish config
          ansible.builtin.lineinfile:
            path: ~/.config/fish/config.fish
            line: 'eval "$(/opt/homebrew/bin/brew shellenv)"'
            state: present
            create: yes
      when: fish_status.rc == 0
      tags:
        - fish
        - config

    # Fisher and all fish plugins (fzf.fish, etc.) are vendored in this repo and
    # symlinked into ~/.config/fish, so there is nothing to install or sync here.

    - name: Configure default shell
      block:
        - name: Get Fish shell path
          ansible.builtin.command: which fish
          register: fish_path
          changed_when: false

        - name: Add Fish to allowed shells
          ansible.builtin.lineinfile:
            path: /etc/shells
            line: "{{ fish_path.stdout }}"
            state: present
            create: false
          become: true
          register: shells_update

        - name: Report shells update
          ansible.builtin.debug:
            msg: "Added Fish ({{ fish_path.stdout }}) to allowed shells"
          when: shells_update.changed

        - name: Set Fish as default shell
          ansible.builtin.user:
            name: "{{ username }}"
            shell: "{{ fish_path.stdout }}"
          become: true
          register: shell_change

        - name: Report shell change
          ansible.builtin.debug:
            msg: "Changed default shell to Fish for user {{ username }}"
          when: shell_change.changed
      when: fish_status.rc == 0
      tags:
        - fish
        - shell

  post_tasks:
    - name: Display final installation report
      ansible.builtin.debug:
        msg: |
          Installation Report:
          ===================
          Operating System: {{ install_report.os_type }}

          Package Management:
          - Homebrew: {{ 'Installed successfully' if homebrew_status.rc == 0 or homebrew_installation is success else 'Installation failed' }}
          - Installed: {{ install_report.packages_installed | join(', ') }}
          {% if install_report.packages_failed %}
          - Failed: {{ install_report.packages_failed | join(', ') }}
          {% endif %}

          Shell Configuration:
          - Fish Shell: {{ 'Installed' if fish_status.rc == 0 else 'Not installed' }}

          Dotfiles:
          - Status: {{ 'Cloned successfully' if dotfiles_clone.changed else 'Already existed' }}
          - Configs: {{ install_report.configs_linked | join(', ') }}
          - Backups: {{ install_report.backups_created | join(', ') }}
      tags:
        - always
        - report
