right_format = "$memory_usage $cmd_duration $time"

[time]
disabled = false
time_format = "%H:%M:%S"
format = "[$time]($style)"
style = "fg:#907aa9"       # iris blue-purple

[cmd_duration]
min_time = 2_000
format = "[$duration]($style)"
style = "fg:#6e6a86"

[directory]
style = "bold fg:#9ccfff" # mauve (main pink)read_only = " 󰌾"

[git_branch]
symbol = " "
style = "fg:#ffbcff"

[git_status]
style = "fg:#ebbcba" # rose

[git_state]
style = "fg:#f38ba8" # love (strong pink)

[package]
